name: Fetch and Update PDF via IMAP

on:
  schedule:
    - cron: "0 * * * *"    # Every hour on the hour
  workflow_dispatch:      # Manual trigger

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: (Optional) Install dependencies
      run: |
        pip install --upgrade pip
        # No extra packages needed if you're using stdlib imaplib

    - name: Fetch latest PDF via IMAP
      env:
        GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        python fetch_pdf.py

    - name: Commit & push latest.pdf
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        # Override the remote to use your PAT
        git remote set-url origin https://x-access-token:$GH_TOKEN@github.com/Lesage974/QRNews.git
        # Set a valid commit identity
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        # Stage and commit if changed
        git add latest.pdf
        git commit -m "Update PDF via GitHub Actions" || echo "No changes to commit"
        git push origin main
