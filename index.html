<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QRNews PDF Viewer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
  <link rel="stylesheet" href="css/styles.css">
</head>
<header class="site-header">
  <a href="index.html" class="logo">
    <img src="MERCURE.png" alt="Grand Mercure Logo">
  </a>
  <nav class="main-nav">
    <ul>
      <li><a href="brazil.html">Brazil News</a></li>
      <li><a href="international.html">International News</a></li>
      <li><a href="financial.html">Financial News</a></li>
    </ul>
  </nav>
</header>
<body>
  <!-- Pointing to viewer.html inside the 'web' folder, passing the URL of latest.pdf -->
  <iframe src="web/viewer.html?file=../latest.pdf" allowfullscreen></iframe>
  <script>
  // grab the button
  const toTop = document.getElementById('scrollToTop');
  
  // show/hide on scroll
  window.addEventListener('scroll', () => {
    if (window.scrollY > 200) {
      toTop.classList.add('show');
    } else {
      toTop.classList.remove('show');
    }
  });
  
  // smooth scroll to top
  toTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  </script>

</body>
<button id="scrollToTop" title="Back to top"><img src="scroll.png" alt="scroll"></button>
</html>
